                let matchCount = 0;
                row.forEach(cell => {
                    if (cell && typeof cell === 'string') {
                        const cellText = normalizeHeader(cell);
                        if (keywords.some(k => cellText.includes(k))) matchCount++;
                    }
                });
                if (matchCount >= 2) return i;

            const ss = String(now.getSeconds()).padStart(2, '0');

            const [convertedData, setConvertedData] = useState([]);
            const [isConverting, setIsConverting] = useState(false);
            const [errorMsg, setErrorMsg] = useState("");
            const [currentPage, setCurrentPage] = useState(1);
            const rowsPerPage = 50;

            // To save space, I will reuse the logic structure but ensure it's conditioned on activeTab
            
            const indexOfLastRow = currentPage * rowsPerPage;
            const indexOfFirstRow = indexOfLastRow - rowsPerPage;
            const currentRows = convertedData.slice(indexOfFirstRow, indexOfLastRow);
            const totalPages = Math.ceil(convertedData.length / rowsPerPage);

            const handlePageChange = (pageNumber) => setCurrentPage(pageNumber);

            const handleFileChange = (e) => {
                const uploadedFile = e.target.files[0];
                if (!uploadedFile) return;
                setFile(uploadedFile);
                setErrorMsg("");
                setConvertedData([]);
                setWorkbook(null);
                setCurrentPage(1);
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const wb = XLSX.read(data, { type: 'array' });
                        setWorkbook(wb);
                        setSheets(wb.SheetNames);
                        if (wb.SheetNames.length > 0) setSelectedSheet(wb.SheetNames[0]);
                        setFileInfo({ name: uploadedFile.name, size: (uploadedFile.size / 1024).toFixed(2) + " KB", sheets: wb.SheetNames.length });
                    } catch (err) { setErrorMsg("檔案解析失敗"); }
                };
                reader.readAsArrayBuffer(uploadedFile);
            };

            const processData = () => {
                if (!workbook || !selectedSheet || !sourceType) { setErrorMsg("請先上傳檔案並選擇來源"); return; }
                if (!updatedBy.trim()) { setErrorMsg("請輸入更新者姓名"); return; }
                setIsConverting(true);
                setErrorMsg("");
                setCurrentPage(1);
                setTimeout(() => {
                    try {
                        const ws = workbook.Sheets[selectedSheet];
                        const rawData = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "" });
                        if (rawData.length < 2) throw new Error("資料不足");
                        const headerRowIndex = findHeaderRowIndex(rawData, sourceType);
                        const sourceHeaders = rawData[headerRowIndex];
                        const sourceRows = rawData.slice(headerRowIndex + 1);
                        const currentEtlId = generateEtlId();
                        // Batch Date Prefix
                        const now = new Date();
                        const yyyy = now.getFullYear();
                        const mm = String(now.getMonth() + 1).padStart(2, '0');
                        const dd = String(now.getDate()).padStart(2, '0');
                        const memberIdPrefix = `etl-${yyyy}${mm}${dd}-`;

                        const result = sourceRows.map((row, index) => {
                            if (row.every(cell => !cell)) return null;
                            const mappedRow = {};
                            TARGET_HEADERS.forEach(h => mappedRow[h] = "");
                            
                            const seq = String(index + 1).padStart(5, '0');
                            mappedRow["member_id"] = `${memberIdPrefix}${seq}`;
                            mappedRow["etl_id_ref"] = currentEtlId;
                            mappedRow["updated_by"] = updatedBy;

                            sourceHeaders.forEach((header, index) => {
                                const normHeader = normalizeHeader(header);
                                const targetField = MAPPING_DICT[normHeader];
                                if (targetField) {
                                    let value = row[index];
                                    if (targetField === 'birthday' || targetField === 'created_at') value = normalizeDateToISO(value);
                                    if (targetField === 'mobile_phone') value = String(value).replace(/[\-\s]/g, '');
                                    if (targetField === 'id_number' && value) value = String(value).trim().toUpperCase();
                                    if (targetField === 'web_member_id' && sourceType !== 'F04') value = "";
                                    if (value !== undefined && value !== null && value !== "") mappedRow[targetField] = value;
                                }
                            });
                            if (mappedRow["id_number"] && !mappedRow["id_number_masked"]) mappedRow["id_number_masked"] = maskIdNumber(mappedRow["id_number"]);
                            if (!mappedRow["ethnicity"]) mappedRow["ethnicity"] = "一般";
                            mappedRow["data_source"] = sourceType; 
                            return mappedRow;
                        }).filter(row => row !== null);
                        setConvertedData(result);
                    } catch (err) { setErrorMsg("轉換錯誤: " + err.message); } finally { setIsConverting(false); }
                }, 500);
            };

            const downloadExcel = () => {
                if (convertedData.length === 0) return;
                const ws = XLSX.utils.json_to_sheet(convertedData, { header: TARGET_HEADERS, skipHeader: false });
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Members_DB");
                XLSX.writeFile(wb, `Trans_db_${sourceType}_${new Date().toISOString().slice(0,10)}.xlsx`);
            };

            return (
                <div className="min-h-screen flex flex-col">
                    <Header />

                    <div className="bg-white shadow-sm border-b sticky top-16 z-40 no-print">
                        <div className="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex space-x-8 -mb-px">
                                <button 
                                    className={`py-4 px-1 font-medium text-sm transition-colors duration-200 ${activeTab === 'manual' ? 'tab-active' : 'tab-inactive'}`}
                                    onClick={() => setActiveTab('manual')}
                                >
                                    人工單筆輸入
                                </button>
                                <button 
                                    className={`py-4 px-1 font-medium text-sm transition-colors duration-200 ${activeTab === 'batch' ? 'tab-active' : 'tab-inactive'}`}
                                    onClick={() => setActiveTab('batch')}
                                >
                                    批次檔案轉換
                                </button>
                            </div>
                        </div>
                    </div>

                    <main className="flex-grow max-w-5xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8 space-y-6">
                        
                        {activeTab === 'manual' && (
                            <ManualEntry />
                        )}

                        {activeTab === 'batch' && (
                            <div className="animate-fade-in no-print">
                                 {/* Batch Converter UI (Reused from previous version) */}
                                <Section title="1. 上傳來源檔案" icon={Upload}>
                                    <div className="flex flex-col sm:flex-row items-center gap-4">
                                        <label className="block flex-1 w-full">
                                            <input type="file" ref={fileInputRef} accept=".xlsx, .xls" onChange={handleFileChange} className="block w-full text-sm text-gray-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer" />
                                        </label>
                                    </div>
                                    {fileInfo && (
                                        <div className="mt-4 p-4 bg-green-50 rounded-md border border-green-200 text-sm text-green-800">
                                            檔案：{fileInfo.name} ({fileInfo.size}), {fileInfo.sheets} sheets
                                            <select value={selectedSheet} onChange={(e) => setSelectedSheet(e.target.value)} className="ml-2 form-select border-gray-300 rounded-md text-sm">{sheets.map(s => <option key={s} value={s}>{s}</option>)}</select>
                                        </div>
                                    )}
                                </Section>

                                <Section title="2. 選擇來源類型" icon={FileSpreadsheet}>
                                    <div className="flex flex-col sm:flex-row sm:items-center gap-4">
                                        <select value={sourceType} onChange={(e) => setSourceType(e.target.value)} className="flex-1 mt-1 block w-full pl-3 pr-10 py-2.5 border-gray-300 rounded-md shadow-sm border">
                                            <option value="" disabled>-- 請選擇來源 --</option>
                                            {SOURCE_TYPES.map(type => <option key={type.id} value={type.id}>{type.name}</option>)}
                                        </select>
                                        <button 
                                            onClick={() => setIsDocsOpen(true)}
                                            className="mt-1 inline-flex items-center px-4 py-2 border border-blue-300 shadow-sm text-sm font-medium rounded-md text-blue-700 bg-white hover:bg-blue-50 focus:outline-none"
                                        >
                                            <List className="h-4 w-4 mr-2" />
                                            查看來源欄位對照說明 (Schema)
                                        </button>
                                    </div>
                                </Section>

                                <Section title="3. 資料更新者 (必填)" icon={User}>
                                    <input type="text" value={updatedBy} onChange={(e) => setUpdatedBy(e.target.value)} placeholder="請輸入您的姓名" className="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm" />
                                </Section>

                                <Section title="4. 執行轉換與下載" icon={Download}>
                                    {errorMsg && <div className="mb-4 p-4 bg-red-50 text-red-700">{errorMsg}</div>}
                                    <div className="flex gap-4 mb-6">
                                        <button onClick={processData} disabled={isConverting || !file || !sourceType || !updatedBy} className={`flex-1 px-4 py-2 text-white bg-blue-600 rounded-md hover:bg-blue-700 disabled:bg-gray-300 ${isConverting?'opacity-75':''}`}>{isConverting ? '處理中...' : '開始轉換'}</button>
                                        <button onClick={downloadExcel} disabled={convertedData.length === 0} className="flex-1 px-4 py-2 text-blue-700 bg-blue-100 rounded-md hover:bg-blue-200 disabled:bg-gray-100 disabled:text-gray-400">下載 Trans_db.xlsx</button>
                                    </div>
                                    {convertedData.length > 0 && (
                                        <div>
                                            <div className="flex justify-between mb-2"><h4 className="font-bold">結果：{convertedData.length} 筆</h4>
                                            <div className="space-x-2"><button onClick={()=>handlePageChange(currentPage-1)} disabled={currentPage===1} className="px-2 py-1 border rounded disabled:opacity-50">&lt;</button><span>{currentPage}/{totalPages}</span><button onClick={()=>handlePageChange(currentPage+1)} disabled={currentPage===totalPages} className="px-2 py-1 border rounded disabled:opacity-50">&gt;</button></div></div>
                                            <div className="overflow-x-auto border rounded table-container">
                                                <table className="min-w-full divide-y divide-gray-200"><thead className="bg-gray-50"><tr>{TARGET_HEADERS.map(h=><th key={h} className="px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase whitespace-nowrap">{h}</th>)}</tr></thead>
                                                <tbody className="bg-white divide-y divide-gray-200">{currentRows.map((r,i)=><tr key={i}>{TARGET_HEADERS.map(h=><td key={h} className="px-3 py-2 text-sm text-gray-500 whitespace-nowrap">{r[h]}</td>)}</tr>)}</tbody></table>
                                            </div>
                                        </div>
                                    )}
                                </Section>
                            </div>
                        )}

                    </main>

                    {/* Integrated Source Docs Modal */}
                    <SourceFileDocsModal isOpen={isDocsOpen} onClose={() => setIsDocsOpen(false)} />

                    <footer className="bg-gray-800 text-white py-6 mt-auto no-print">
                        <div className="max-w-7xl mx-auto px-4 text-center">
                            <p className="text-sm text-gray-400 mb-1">Last Update: {LAST_UPDATE}</p>
                            <p className="text-sm font-medium">
                                Designed by <a href="https://www.linkedin.com/in/force-cheng-taiwan" target="_blank" rel="noopener noreferrer" className="text-blue-300 hover:text-blue-100 underline decoration-blue-300/50 hover:decoration-blue-100">Force Fox 原力狐</a>
                            </p>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
